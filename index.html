<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Cumpleaños María Isabel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #161618;
      color: #ffffff;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      perspective: 1100px;
    }

    /* Fondo de estrellas y fuegos artificiales en 3D */
    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Capa de globos flotantes con profundidad 3D e interacción */
    #balloonsLayer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .balloon {
      position: absolute;
      bottom: -95px;
      width: 34px;
      height: 42px;
      border-radius: 50% 50% 48% 48% / 55% 55% 42% 42%;
      opacity: 0.92;
      pointer-events: auto;
      cursor: pointer;
      box-shadow:
        inset -7px -9px 15px rgba(0, 0, 0, 0.32),
        inset 6px 6px 12px rgba(255, 255, 255, 0.45),
        0 10px 22px rgba(0, 0, 0, 0.36);
      animation: floatUp3D var(--dur, 11s) linear forwards;
      transition: filter 0.2s ease;
    }

    /* Brillo especular 3D en el globo */
    .balloon::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 8px;
      width: 8px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(-24deg);
      pointer-events: none;
    }

    /* Cuerda fina del globo */
    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1.5px;
      height: 46px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.08));
      transform: translateX(-50%);
      pointer-events: none;
    }

    .balloon:hover {
      filter: brightness(1.16) drop-shadow(0 0 10px rgba(255, 255, 255, 0.35));
    }

    .balloon.pop-effect {
      animation: balloonPop 0.34s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      pointer-events: none;
    }

    @keyframes balloonPop {
      0% {
        opacity: 0.95;
        transform: translate3d(0, var(--pop-y, 0px), var(--z-pos, 0px)) scale(1.18);
      }
      100% {
        opacity: 0;
        transform: translate3d(0, var(--pop-y, 0px), calc(var(--z-pos, 0px) + 50px)) scale(1.9);
      }
    }

    @keyframes floatUp3D {
      0% {
        transform: translate3d(0, 0, var(--z-pos, 0px)) rotate(-4deg);
      }
      25% {
        transform: translate3d(calc(var(--drift, 20px) * 0.65), -28vh, calc(var(--z-pos, 0px) + 18px)) rotate(3deg);
      }
      50% {
        transform: translate3d(var(--drift, 20px), -56vh, calc(var(--z-pos, 0px) + 32px)) rotate(5deg);
      }
      75% {
        transform: translate3d(calc(var(--drift, 20px) * -0.35), -85vh, calc(var(--z-pos, 0px) + 14px)) rotate(-3deg);
      }
      100% {
        transform: translate3d(calc(var(--drift, 20px) * -0.7), -118vh, var(--z-pos, 0px)) rotate(-2deg);
      }
    }

    /* Tarjeta central limpia y centrada con efecto 3D sutil */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 540px;
      padding: 28px 24px 32px;
      border-radius: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateZ(18px);
      transition: transform 0.16s ease-out;
    }

    .cake-emoji {
      font-size: clamp(2.8rem, 7vw, 3.8rem);
      line-height: 1.1;
      transform: translateZ(30px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
    }

    .main-title {
      font-size: clamp(1.9rem, 5.2vw, 2.85rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #f5f5f7;
      transform: translateZ(22px);
    }

    .highlight-name {
      display: block;
      color: #ff6b9d;
      margin-top: 2px;
    }

    .subtitle {
      font-size: clamp(0.92rem, 2.3vw, 1.05rem);
      color: #c8c8cf;
      font-weight: 400;
      margin-top: 2px;
      transform: translateZ(14px);
    }

    .wish-btn {
      margin-top: 10px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c6cf0 0%, #6552e6 100%);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transform: translateZ(26px);
      box-shadow: 0 8px 22px rgba(101, 82, 230, 0.38);
      transition: transform 0.16s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .wish-btn:hover {
      transform: translateZ(32px) translateY(-2px);
      box-shadow: 0 12px 26px rgba(124, 108, 240, 0.52);
      filter: brightness(1.06);
    }

    .wish-btn:active {
      transform: translateZ(20px) translateY(1px) scale(0.98);
    }

    .dedication {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 440px;
      transform: translateZ(12px);
    }

    .quote-line {
      font-size: clamp(0.88rem, 2.2vw, 1rem);
      font-style: italic;
      color: #e4e4ea;
      line-height: 1.45;
    }

    .wish-line {
      font-size: clamp(0.84rem, 2vw, 0.95rem);
      color: #b7b7c2;
      line-height: 1.45;
    }

    /* Controles discretos en esquina superior derecha */
    .audio-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-pill-btn {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(34, 34, 40, 0.72);
      color: #f3f3f7;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .audio-pill-btn:hover {
      background: rgba(54, 54, 64, 0.88);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .audio-pill-btn:active {
      transform: scale(0.97);
    }

    .audio-pill-btn.is-playing {
      border-color: rgba(255, 107, 157, 0.65);
      background: rgba(88, 36, 62, 0.75);
    }

    .wish-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 30;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(36, 36, 44, 0.92);
      border: 1px solid rgba(255, 107, 157, 0.45);
      color: #fff0f6;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      text-align: center;
      max-width: calc(100vw - 32px);
    }

    .wish-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Audio local adjunto: CUMPLEAÑOS.mp3 -->
  <audio id="birthdayAudio" src="./CUMPLEAÑOS.mp3" preload="auto" loop></audio>

  <!-- Canvas para estrellas 3D con efectos y fuegos artificiales 3D hacia arriba -->
  <canvas id="fxCanvas" aria-hidden="true"></canvas>

  <!-- Capa para globos ascendentes con efecto 3D -->
  <div id="balloonsLayer" aria-hidden="true"></div>

  <!-- Control discreto para pausar/reanudar o silenciar -->
  <div class="audio-bar" role="region" aria-label="Control de audio">
    <button id="toggleAudioBtn" class="audio-pill-btn" type="button" aria-pressed="false">
      🎵 Reproducir CUMPLEAÑOS.mp3
    </button>
    <button id="muteAudioBtn" class="audio-pill-btn" type="button" aria-pressed="false" title="Silenciar o activar">
      🔊
    </button>
  </div>

  <!-- Contenido principal centrado -->
  <main class="stage">
    <section id="card3d" class="card" aria-label="Saludo de cumpleaños para María Isabel">
      <div class="cake-emoji" aria-hidden="true">🎂</div>

      <h1 class="main-title">
        Feliz Cumpleaños
        <span class="highlight-name">María Isabel! 🫶🏻</span>
      </h1>

      <p class="subtitle">Un año más, otro hermoso viaje ✨</p>

      <button id="wishBtn" class="wish-btn" type="button">
        Pide un deseo ✨
      </button>

      <div class="dedication">
        <p class="quote-line">"Que cada paso de este nuevo año esté lleno de luz y alegría"</p>
        <p class="wish-line">Que la vida te regale lo mejor en todo lo que esperas. 🤍✨</p>
      </div>
    </section>
  </main>

  <div id="wishToast" class="wish-toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const audioEl = document.getElementById("birthdayAudio");
      const toggleAudioBtn = document.getElementById("toggleAudioBtn");
      const muteAudioBtn = document.getElementById("muteAudioBtn");
      const wishBtn = document.getElementById("wishBtn");
      const wishToast = document.getElementById("wishToast");
      const balloonsLayer = document.getElementById("balloonsLayer");
      const card3d = document.getElementById("card3d");
      const canvas = document.getElementById("fxCanvas");
      const ctx = canvas ? canvas.getContext("2d") : null;

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // ---------------------------------------------------------------------
      // 1. Reproducción del audio CUMPLEAÑOS.mp3 (auto-intento + primer gesto)
      // ---------------------------------------------------------------------
      let audioStarted = false;
      let toastTimer = null;

      function showToast(text) {
        if (!wishToast) return;
        wishToast.textContent = text;
        wishToast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          wishToast.classList.remove("show");
        }, 2600);
      }

      function updateAudioUI() {
        if (!audioEl || !toggleAudioBtn) return;
        const playing = !audioEl.paused;
        toggleAudioBtn.textContent = playing ? "⏸ Pausar CUMPLEAÑOS.mp3" : "🎵 Reproducir CUMPLEAÑOS.mp3";
        toggleAudioBtn.setAttribute("aria-pressed", playing ? "true" : "false");
        toggleAudioBtn.classList.toggle("is-playing", playing);

        if (muteAudioBtn) {
          muteAudioBtn.textContent = audioEl.muted ? "🔇" : "🔊";
          muteAudioBtn.setAttribute("aria-pressed", audioEl.muted ? "true" : "false");
        }
      }

      function playBirthdayAudio(showFeedbackOnError) {
        if (!audioEl) return;
        audioEl.volume = 0.85;
        const p = audioEl.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            audioStarted = true;
            updateAudioUI();
          }).catch(() => {
            updateAudioUI();
            if (showFeedbackOnError) {
              showToast("Asegúrate de tener CUMPLEAÑOS.mp3 en la misma carpeta");
            }
          });
        } else {
          updateAudioUI();
        }
      }

      window.addEventListener("DOMContentLoaded", () => playBirthdayAudio(false));
      window.addEventListener("load", () => playBirthdayAudio(false));
      playBirthdayAudio(false);

      function handleFirstGesture() {
        if (!audioStarted && audioEl && audioEl.paused) {
          playBirthdayAudio(false);
        }
      }

      ["pointerdown", "click", "touchstart", "keydown"].forEach((evt) => {
        window.addEventListener(evt, handleFirstGesture, { once: true, passive: true });
      });

      if (toggleAudioBtn) {
        toggleAudioBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!audioEl) return;
          if (audioEl.paused) {
            playBirthdayAudio(true);
          } else {
            audioEl.pause();
            updateAudioUI();
          }
        });
      }

      if (muteAudioBtn) {
        muteAudioBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!audioEl) return;
          audioEl.muted = !audioEl.muted;
          if (!audioEl.muted && audioEl.paused) {
            playBirthdayAudio(false);
          } else {
            updateAudioUI();
          }
        });
      }

      if (audioEl) {
        audioEl.addEventListener("play", updateAudioUI);
        audioEl.addEventListener("pause", updateAudioUI);
        audioEl.addEventListener("volumechange", updateAudioUI);
        audioEl.addEventListener("error", () => {
          showToast("No se encontró CUMPLEAÑOS.mp3 junto al archivo HTML");
        });
      }

      // ---------------------------------------------------------------------
      // 2. Efecto 3D sutil en la tarjeta al mover el puntero
      // ---------------------------------------------------------------------
      let tiltX = 0;
      let tiltY = 0;

      window.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / Math.max(1, width)) * 2 - 1;
        const ny = (e.clientY / Math.max(1, height)) * 2 - 1;
        tiltY = nx * 6;
        tiltX = -ny * 5;
        if (card3d) {
          card3d.style.setProperty("--tilt-x", `${tiltX.toFixed(2)}deg`);
          card3d.style.setProperty("--tilt-y", `${tiltY.toFixed(2)}deg`);
        }
      }, { passive: true });

      // ---------------------------------------------------------------------
      // 3. Globos flotantes suaves con efectos 3D, más variedad y destello al tocar
      // ---------------------------------------------------------------------
      const BALLOON_COLORS = [
        "#ff5c8a",
        "#56cfe1",
        "#ffd166",
        "#9b5de5",
        "#4cc9f0",
        "#ff8fab",
        "#80ed99",
        "#ff9e00",
        "#f72585",
        "#4361ee"
      ];

      function spawnBalloon(customLeftPct, customZ) {
        if (!balloonsLayer) return;
        const b = document.createElement("div");
        b.className = "balloon";
        const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
        const leftPct = typeof customLeftPct === "number" ? customLeftPct : (3 + Math.random() * 94);
        const durationSec = 8 + Math.random() * 6.5;
        const driftPx = (Math.random() * 2 - 1) * 44;
        const zPos = typeof customZ === "number" ? customZ : (-85 + Math.random() * 170);
        const sizeFactor = 0.72 + ((zPos + 85) / 255) * 0.52;

        b.style.left = `${leftPct}%`;
        b.style.backgroundColor = color;
        b.style.width = `${Math.round(34 * sizeFactor)}px`;
        b.style.height = `${Math.round(42 * sizeFactor)}px`;
        b.style.setProperty("--drift", `${driftPx}px`);
        b.style.setProperty("--z-pos", `${zPos.toFixed(0)}px`);
        b.style.setProperty("--dur", `${durationSec.toFixed(1)}s`);

        b.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          playBirthdayAudio(false);
          const rect = b.getBoundingClientRect();
          const cx = rect.left + rect.width * 0.5;
          const cy = rect.top + rect.height * 0.5;
          const x3d = (cx - width * 0.5) * 0.85;
          const y3d = (cy - height * 0.5) * 0.85;
          explode3D(x3d, y3d, zPos, color);
          b.style.setProperty("--pop-y", `${(rect.top - (height - 95)).toFixed(0)}px`);
          b.classList.add("pop-effect");
          setTimeout(() => {
            if (b && b.parentNode) b.parentNode.removeChild(b);
          }, 360);
        });

        balloonsLayer.appendChild(b);

        setTimeout(() => {
          if (b && b.parentNode && !b.classList.contains("pop-effect")) {
            b.parentNode.removeChild(b);
          }
        }, durationSec * 1000 + 250);
      }

      for (let i = 0; i < 12; i++) {
        setTimeout(() => spawnBalloon((i * 8.2) % 95, -80 + (i % 5) * 40), i * 320);
      }
      setInterval(() => {
        spawnBalloon();
        if (Math.random() < 0.55) {
          setTimeout(spawnBalloon, 320);
        }
      }, 950);

      // ---------------------------------------------------------------------
      // 4. Estrellas 3D con efectos + Fuegos artificiales 3D que van hacia arriba
      // ---------------------------------------------------------------------
      const FOV = 520;
      const stars = [];
      const upwardRockets = [];
      const sparks3D = [];

      const FIREWORK_COLORS = [
        "#ff4d8d",
        "#48cae4",
        "#ffd166",
        "#a855f7",
        "#4ade80",
        "#fb7185",
        "#38bdf8"
      ];

      function project3D(x3d, y3d, z3d) {
        const scale = FOV / Math.max(40, FOV + z3d);
        return {
          x: width * 0.5 + (x3d + tiltY * (z3d * 0.08)) * scale,
          y: height * 0.5 + (y3d - tiltX * (z3d * 0.08)) * scale,
          scale
        };
      }

      const STAR_TINTS = [
        "255, 255, 255",
        "255, 244, 214",
        "224, 242, 254",
        "252, 231, 243"
      ];

      function initStars() {
        stars.length = 0;
        const count = Math.min(210, Math.floor((width * height) / 7500));
        for (let i = 0; i < count; i++) {
          const isSparkleStar = i % 5 === 0;
          stars.push({
            x3d: (Math.random() * 2 - 1) * width * 0.88,
            y3d: (Math.random() * 2 - 1) * height * 0.88,
            z3d: -220 + Math.random() * 420,
            r: isSparkleStar ? (1.2 + Math.random() * 1.4) : (0.6 + Math.random() * 1.2),
            alpha: 0.3 + Math.random() * 0.68,
            twinkleSpeed: 1.4 + Math.random() * 3.0,
            phase: Math.random() * Math.PI * 2,
            driftX: (Math.random() - 0.5) * 6,
            driftY: -(2 + Math.random() * 6),
            tint: STAR_TINTS[i % STAR_TINTS.length],
            hasCrossGlint: isSparkleStar
          });
        }
      }

      function launchUpwardRocket(x3d, targetY3d, z3d, color) {
        upwardRockets.push({
          x3d: x3d,
          y3d: height * 0.55,
          z3d: z3d,
          vx3d: (Math.random() - 0.5) * 45,
          vy3d: -(430 + Math.random() * 180),
          vz3d: (Math.random() - 0.5) * 35,
          targetY3d: targetY3d,
          color: color
        });
      }

      function explode3D(x3d, y3d, z3d, color) {
        const secondary = FIREWORK_COLORS[(FIREWORK_COLORS.indexOf(color) + 1) % FIREWORK_COLORS.length];
        for (let i = 0; i < 38; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const speed = 75 + Math.random() * 185;
          sparks3D.push({
            x3d: x3d,
            y3d: y3d,
            z3d: z3d,
            vx3d: Math.sin(phi) * Math.cos(theta) * speed,
            vy3d: (Math.cos(phi) - 0.3) * speed,
            vz3d: Math.sin(phi) * Math.sin(theta) * speed,
            color: i % 4 === 0 ? secondary : color,
            radius: 1.8 + Math.random() * 1.8,
            life: 1.0,
            decay: 0.85 + Math.random() * 0.45
          });
        }
      }

      function launchUpwardFireworks(count) {
        const bursts = count || 4;
        for (let b = 0; b < bursts; b++) {
          const color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
          const startX3d = (Math.random() * 2 - 1) * Math.min(420, width * 0.45);
          const targetY3d = -height * (0.14 + Math.random() * 0.26);
          const z3d = -100 + Math.random() * 200;
          setTimeout(() => {
            launchUpwardRocket(startX3d, targetY3d, z3d, color);
          }, b * 120);
        }
      }

      if (wishBtn) {
        wishBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          playBirthdayAudio(false);
          launchUpwardFireworks(5);
          for (let k = 0; k < 4; k++) {
            setTimeout(() => spawnBalloon(), k * 140);
          }
          showToast("✨ ¡Feliz cumpleaños, María Isabel! Que se cumpla tu deseo ✨");
        });
      }

      function handleResize() {
        width = Math.max(320, window.innerWidth || 800);
        height = Math.max(240, window.innerHeight || 600);
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        if (canvas && ctx) {
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        initStars();
      }

      window.addEventListener("resize", handleResize);

      let lastNow = performance.now();
      function animate(now) {
        const dt = Math.min((now - lastNow) / 1000, 0.05);
        lastNow = now;
        const sec = now / 1000;

        if (ctx) {
          ctx.clearRect(0, 0, width, height);

          // Estrellas 3D con parpadeo, halo luminoso y destellos en cruz
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.x3d += s.driftX * dt;
            s.y3d += s.driftY * dt;
            const boundX = width * 0.92;
            const boundY = height * 0.92;
            if (s.x3d > boundX) s.x3d = -boundX;
            if (s.x3d < -boundX) s.x3d = boundX;
            if (s.y3d < -boundY) s.y3d = boundY;
            if (s.y3d > boundY) s.y3d = -boundY;

            const pr = project3D(s.x3d, s.y3d, s.z3d);
            const pulse = 0.5 + 0.5 * Math.sin(sec * s.twinkleSpeed + s.phase);
            const twinkle = s.alpha * (0.45 + 0.55 * pulse);
            const radius = Math.max(0.5, s.r * pr.scale * (0.85 + 0.35 * pulse));

            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, twinkle));
            ctx.fillStyle = `rgb(${s.tint})`;
            ctx.shadowColor = `rgba(${s.tint}, 0.85)`;
            ctx.shadowBlur = (s.hasCrossGlint ? 12 : 6) * pr.scale;

            ctx.beginPath();
            ctx.arc(pr.x, pr.y, radius, 0, Math.PI * 2);
            ctx.fill();

            if (s.hasCrossGlint && pulse > 0.35) {
              const arm = radius * (2.6 + pulse * 2.2);
              ctx.strokeStyle = `rgba(${s.tint}, ${(0.55 * pulse).toFixed(3)})`;
              ctx.lineWidth = Math.max(0.6, 0.9 * pr.scale);
              ctx.beginPath();
              ctx.moveTo(pr.x - arm, pr.y);
              ctx.lineTo(pr.x + arm, pr.y);
              ctx.moveTo(pr.x, pr.y - arm);
              ctx.lineTo(pr.x, pr.y + arm);
              ctx.stroke();
            }
            ctx.restore();
          }

          // Cohetes subiendo hacia arriba en 3D
          for (let i = upwardRockets.length - 1; i >= 0; i--) {
            const r = upwardRockets[i];
            r.x3d += r.vx3d * dt;
            r.y3d += r.vy3d * dt;
            r.z3d += r.vz3d * dt;
            r.vy3d *= Math.pow(0.96, dt * 60);

            const pr = project3D(r.x3d, r.y3d, r.z3d);
            ctx.save();
            ctx.fillStyle = r.color;
            ctx.shadowColor = r.color;
            ctx.shadowBlur = 10 * pr.scale;
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, Math.max(1.5, 2.8 * pr.scale), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (r.y3d <= r.targetY3d || r.vy3d > -65) {
              explode3D(r.x3d, r.y3d, r.z3d, r.color);
              upwardRockets.splice(i, 1);
            }
          }

          // Chispas de fuegos artificiales en 3D
          sparks3D.sort((a, b) => a.z3d - b.z3d);
          for (let i = sparks3D.length - 1; i >= 0; i--) {
            const p = sparks3D[i];
            p.x3d += p.vx3d * dt;
            p.y3d += p.vy3d * dt;
            p.z3d += p.vz3d * dt;
            p.vy3d += 90 * dt;
            p.vx3d *= Math.pow(0.985, dt * 60);
            p.vy3d *= Math.pow(0.985, dt * 60);
            p.vz3d *= Math.pow(0.985, dt * 60);
            p.life -= p.decay * dt;

            if (p.life <= 0) {
              sparks3D.splice(i, 1);
              continue;
            }

            const pr = project3D(p.x3d, p.y3d, p.z3d);
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8 * pr.scale;
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, Math.max(0.8, p.radius * pr.scale), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        requestAnimationFrame(animate);
      }

      handleResize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
